
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beraká | Cotizaciones</title>




    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #17382c;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin: 0;
            font-size: 36px;
            color: #17382c;
        }

        .card p {
            color: #666;
        }
    </style>
</head>

<body>
    

    <h1>BERAKÁ</h1>

    <p>Sistema de gestión de eventos y cotizaciones</p>

    <div class="dashboard">

        <div class="card">
            <h2>{{ total_clientes }}</h2>
            <p>Clientes</p>
        </div>

        <div class="card">
            <h2>{{ total_eventos }}</h2>
            <p>Eventos</p>
        </div>

        <div class="card">
            <h2>{{ total_cotizaciones }}</h2>
            <p>Cotizaciones</p>
        </div>

        <div class="card">
            <h2>{{ total_pagos }}</h2>
            <p>Pagos</p>
        </div>

    </div>
    <a href="{% url 'logout' %}" class="btn-logout">
    Cerrar sesión
    </a>



</body>

</html>
